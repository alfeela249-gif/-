<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>المزرعة السودانية 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc7e8;font-family:Tahoma,Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:10px;right:10px;left:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;color:white;text-shadow:0 2px 4px #26351c;font-weight:bold}
.panel{background:#172b20bb;border:1px solid #ffffff55;border-radius:12px;padding:8px 12px;font-size:13px}
#help{position:fixed;top:58px;right:10px;background:#172b20b8;color:white;padding:7px 10px;border-radius:10px;font-size:12px;max-width:210px;pointer-events:none}
#controls{position:fixed;bottom:14px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.cluster{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px);gap:5px;pointer-events:auto}
button{border:1px solid #ffffff88;background:#172b20c9;color:white;border-radius:13px;font-size:20px;font-weight:bold;min-width:48px;min-height:46px;touch-action:none;box-shadow:0 3px 8px #0005}
button:active{background:#6b8f36}
#actions{display:flex;flex-direction:column;gap:8px;pointer-events:auto;align-items:end}
#actions button{font-size:13px;padding:0 12px;min-height:42px}
#toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:#14251ddd;color:white;padding:12px 18px;border-radius:12px;display:none;text-align:center;pointer-events:none}
@media(orientation:portrait){#rotate{display:flex}}
#rotate{display:none;position:fixed;inset:0;background:#14251dee;color:white;z-index:10;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="panel">🌾 المزرعة السودانية 3D</div><div class="panel" id="status">المركبة: الجرار</div><div class="panel" id="money">الرصيد: 5,000 ج</div></div>
<div id="help">استخدم الأزرار لقيادة الجرار واستكشاف المزرعة. اقترب من الأرض لزراعة المحصول.</div>
<div id="controls">
 <div class="cluster">
  <span></span><button data-key="forward">▲</button><span></span>
  <button data-key="left">◀</button><button data-key="back">▼</button><button data-key="right">▶</button>
 </div>
 <div id="actions"><button id="switch">🚶 النزول من الجرار</button><button id="plant">🌱 زراعة</button><button id="camera">📷 تغيير الكاميرا</button></div>
</div>
<div id="toast"></div><div id="rotate">↻<br>من فضلك أدر الهاتف إلى الوضع الأفقي للعب</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.getElementById('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9e9);scene.fog=new THREE.Fog(0x91c9e9,55,150);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9efff,0x6b5734,2));
const sun=new THREE.DirectionalLight(0xfff1cf,2.2);sun.position.set(-25,45,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x9c793e));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(parent,w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cylinder(parent,rt,rb,h,color,x,y,z,seg=16){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(color));m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
const field= new THREE.Group();field.position.set(0,.03,-17);scene.add(field);
box(field,34,.12,27,0x67451f,0,0,0);
for(let row=0;row<12;row++){const z=-12+row*2.15;const ridge=box(field,32,.12,.18,0x8d642d,0,.12,z);for(let i=0;i<22;i++){const x=-15+i*1.42;const stem=cylinder(field,.035,.045,.65,0x4b8b36,x,.48,z+.22,7);const leaf=box(field,.08,.32,.04,0x75a943,x+.1,.55,z+.22);leaf.rotation.z=-.3;}}
// distant low hills
for(let i=0;i<18;i++){const hill=new THREE.Mesh(new THREE.SphereGeometry(1,16,10),mat(i%2?0x8e9a55:0x9d9959));hill.scale.set(8+Math.random()*8,2+Math.random()*3,5);hill.position.set(-85+i*10,1,-78-Math.random()*10);scene.add(hill)}
// farm road
const road=box(scene,12,.08,100,0x625b4c,25,.04,-20);
for(let z=-65;z<30;z+=8){box(scene,.18,.03,2,0xe6d5a0,25,.1,z)}
// barn
const barn=new THREE.Group();barn.position.set(-25,0,-15);scene.add(barn);box(barn,12,6,9,0xb85f36,0,3,0);const roof= new THREE.Mesh(new THREE.ConeGeometry(8,3,4),mat(0x773b2b));roof.rotation.y=Math.PI/4;roof.position.set(0,7.3,0);roof.scale.set(1,.6,.8);barn.add(roof);box(barn,3.2,4,.15,0x402b20,0,2,4.58);
for(let i=0;i<5;i++){const trunk=cylinder(scene,.25,.35,2,0x6b4224,-35+i*8,1,-38,8);const crown=new THREE.Mesh(new THREE.SphereGeometry(2.3,12,10),mat(0x3d7138));crown.position.set(-35+i*8,3,-38);crown.castShadow=true;scene.add(crown)}
// water tank
cylinder(scene,2.1,2.1,5,0x9daeb5,17,2.5,-34,24);cylinder(scene,2.2,2.2,.35,0x526b78,17,5.1,-34,24);
// tractor
const tractor=new THREE.Group();scene.add(tractor);
box(tractor,2.7,1.1,4.2,0x2c8b37,0,1.2,0);box(tractor,2.15,1.5,1.9,0x4b9dcd,0,2.35,-.45);box(tractor,2.35,.22,2.1,0x1e5128,0,3.18,-.45);box(tractor,2.9,.22,.3,0xe0b83b,0,1.65,2.0);
const wheels=[];for(const x of [-1.48,1.48])for(const z of [-1.25,1.35]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(z<0?.78:.55,z<0?.78:.55,.42,20),mat(0x202326));wheel.rotation.z=Math.PI/2;wheel.position.set(x,z<0?.78:.55,z);wheel.castShadow=true;tractor.add(wheel);wheels.push(wheel);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.44,16),mat(0xb5b8b4));hub.rotation.z=Math.PI/2;hub.position.copy(wheel.position);tractor.add(hub)}
// farmer
const farmer=new THREE.Group();scene.add(farmer);cylinder(farmer,.28,.34,1.15,0x315d36,0,.85,0);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),mat(0x9a633d));head.position.y=1.58;farmer.add(head);cylinder(farmer,.36,.36,.14,0x46351f,0,1.82,0);box(farmer,.12,.65,.14,0x273b2a,-.2,.38,0);box(farmer,.12,.65,.14,0x273b2a,.2,.38,0);farmer.visible=false;
let driving=true, planted=0, cameraMode=0, speed=0;const keys={};let toastTimer;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',1900)}
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
document.getElementById('switch').onclick=()=>{driving=!driving;tractor.visible=driving;farmer.visible=!driving;if(!driving)farmer.position.copy(tractor.position).add(new THREE.Vector3(2,0,0));document.getElementById('switch').textContent=driving?'🚶 النزول من الجرار':'🚜 ركوب الجرار';document.getElementById('status').textContent=driving?'المركبة: الجرار':'الوضع: المزارع';toast(driving?'ركبت الجرار':'نزلت من الجرار')};
document.getElementById('plant').onclick=()=>{const p=driving?tractor.position:farmer.position;if(Math.abs(p.x)<20&&p.z<-3&&p.z>-34){planted++;toast('تمت زراعة جزء من الحقل! عدد الصفوف: '+planted);document.getElementById('money').textContent='المحصول: '+planted+' صفوف'}else toast('اقترب من الحقل أولاً')};
document.getElementById('camera').onclick=()=>{cameraMode=(cameraMode+1)%3;toast(['كاميرا خلفية','كاميرا قريبة','كاميرا علوية'][cameraMode])};
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const actor=driving?tractor:farmer;const move=keys.forward?1:keys.back?-1:0;const turn=keys.left?1:keys.right?-1:0;
if(move){speed+=(move* (driving?13:5)-speed*2.2)*dt}else speed*=Math.max(0,1-dt*3);
actor.rotation.y+=turn*dt*(driving?1.7:2.3)*(Math.abs(speed)>.1?Math.sign(speed):1);
const dir=new THREE.Vector3(Math.sin(actor.rotation.y),0,Math.cos(actor.rotation.y));actor.position.addScaledVector(dir,-speed*dt);actor.position.x=THREE.MathUtils.clamp(actor.position.x,-48,48);actor.position.z=THREE.MathUtils.clamp(actor.position.z,-58,42);
if(driving)wheels.forEach(w=>w.rotation.x+=speed*dt*1.5);
let target=actor.position.clone();let offset;
if(cameraMode===0)offset=new THREE.Vector3(0,7,12);else if(cameraMode===1)offset=new THREE.Vector3(0,3.5,6);else offset=new THREE.Vector3(0,17,5);
offset.applyAxisAngle(new THREE.Vector3(0,1,0),actor.rotation.y);camera.position.lerp(target.clone().add(offset),.08);camera.lookAt(target.x,target.y+1,target.z);
renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function orient(){document.getElementById('rotate').style.display=innerHeight>innerWidth?'flex':'none'}addEventListener('resize',orient);orient();
</script></body></html>
