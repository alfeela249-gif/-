<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>المزرعة السودانية 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc7e8;font-family:Tahoma,Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:8px;right:8px;left:8px;display:flex;justify-content:space-between;gap:5px;pointer-events:none;color:white;text-shadow:0 2px 4px #26351c;font-weight:bold;flex-wrap:wrap}.panel{background:#172b20d9;border:1px solid #ffffff55;border-radius:11px;padding:7px 10px;font-size:12px}
#help{position:fixed;top:58px;right:8px;background:#172b20c9;color:white;padding:7px 10px;border-radius:10px;font-size:11px;max-width:210px;pointer-events:none}
#controls{position:fixed;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.cluster{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:4px;pointer-events:auto}
button{border:1px solid #ffffff88;background:#172b20dd;color:white;border-radius:12px;font-size:19px;font-weight:bold;min-width:44px;min-height:42px;touch-action:none;box-shadow:0 3px 8px #0005}button:active{background:#6b8f36}
#actions{display:flex;flex-direction:column;gap:5px;pointer-events:auto;align-items:end}#actions button{font-size:11px;padding:0 9px;min-height:36px}
#toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:#14251eee;color:white;padding:12px 18px;border-radius:12px;display:none;text-align:center;pointer-events:none;z-index:5}
#rotate{display:none;position:fixed;inset:0;background:#14251dee;color:white;z-index:10;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px}
#farmMenu{position:fixed;top:104px;right:8px;display:flex;flex-direction:column;gap:5px;pointer-events:auto}#farmMenu button{font-size:11px;min-height:32px;padding:0 9px}
#stats{position:fixed;bottom:112px;right:8px;color:white;background:#172b20c9;padding:7px 10px;border-radius:10px;font-size:11px;pointer-events:none}
@media(orientation:portrait){#rotate{display:flex}}
</style></head><body>
<div id="game"></div>
<div id="hud"><div class="panel">🌾 المزرعة السودانية 3D</div><div class="panel" id="status">🚜 الجرار</div><div class="panel" id="money">💰 5,000 ج</div><div class="panel" id="day">☀️ اليوم 1</div></div>
<div id="help">ازرع ثم اسقِ المحصول وانتظر نموه. اقترب من الحقل للحصاد، ثم بِع المحصول في السوق.</div>
<div id="farmMenu"><button id="seed">🌱 بذور: قمح</button><button id="water">💧 ري الحقل</button><button id="fertilize">🧪 تسميد</button><button id="sleep">🌙 اليوم التالي</button><button id="market">🏪 بيع المحصول</button><button id="animals">🐄 شراء بقرة</button></div>
<div id="stats">🌱 المحصول: 0 | النمو: 0%</div>
<div id="controls"><div class="cluster"><span></span><button data-key="forward">▲</button><span></span><button data-key="left">◀</button><button data-key="back">▼</button><button data-key="right">▶</button></div>
<div id="actions"><button id="switch">🚶 النزول من الجرار</button><button id="plant">🌾 زراعة</button><button id="camera">📷 الكاميرا</button></div></div>
<div id="toast"></div><div id="rotate">↻<br>من فضلك أدر الهاتف إلى الوضع الأفقي للعب</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.getElementById('game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x91c9e9);scene.fog=new THREE.Fog(0x91c9e9,65,175);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,350),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9efff,0x6b5734,2));const sun=new THREE.DirectionalLight(0xfff1cf,2.2);sun.position.set(-25,45,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
function box(parent,w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cyl(parent,rt,rb,h,color,x,y,z,seg=16){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(color));m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),mat(0x9b793f));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const field=new THREE.Group();field.position.set(0,.04,-18);scene.add(field);box(field,36,.13,29,0x69451f,0,0,0);
const cropMeshes=[];for(let r=0;r<10;r++){let z=-13+r*2.7;box(field,34,.1,.16,0x9b7437,0,.12,z);for(let i=0;i<18;i++){let x=-16+i*1.85;const plant=new THREE.Group();plant.position.set(x,.18,z+.35);const stem=cyl(plant,.035,.045,.55,0x538b34,0,.27,0,7);const leaf=box(plant,.08,.28,.05,0x78a943,.08,.38,0);leaf.rotation.z=-.35;plant.visible=false;field.add(plant);cropMeshes.push(plant)}}
const road=box(scene,12,.08,105,0x625b4c,27,.04,-19);for(let z=-67;z<30;z+=8)box(scene,.18,.03,2,0xe6d5a0,27,.1,z);
const barn=new THREE.Group();barn.position.set(-27,0,-16);scene.add(barn);box(barn,12,6,9,0xb85f36,0,3,0);const roof=new THREE.Mesh(new THREE.ConeGeometry(8,3,4),mat(0x773b2b));roof.rotation.y=Math.PI/4;roof.position.set(0,7.3,0);roof.scale.set(1,.6,.8);barn.add(roof);box(barn,3.2,4,.15,0x402b20,0,2,4.58);
for(let i=0;i<8;i++){cyl(scene,.25,.35,2,0x6b4224,-42+i*9,1,-42,8);const crown=new THREE.Mesh(new THREE.SphereGeometry(2.5,12,10),mat(0x3d7138));crown.position.set(-42+i*9,3,-42);scene.add(crown)}
cyl(scene,2.1,2.1,5,0x9daeb5,17,2.5,-34,24);cyl(scene,2.2,2.2,.35,0x526b78,17,5.1,-34,24);
const tractor=new THREE.Group();scene.add(tractor);box(tractor,2.7,1.1,4.2,0x2c8b37,0,1.2,0);box(tractor,2.15,1.5,1.9,0x4b9dcd,0,2.35,-.45);box(tractor,2.35,.22,2.1,0x1e5128,0,3.18,-.45);box(tractor,2.9,.22,.3,0xe0b83b,0,1.65,2);
const wheels=[];for(const x of [-1.48,1.48])for(const z of [-1.25,1.35]){const radius=z<0?.78:.55,w=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,.42,20),mat(0x202326));w.rotation.z=Math.PI/2;w.position.set(x,radius,z);tractor.add(w);wheels.push(w);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.44,16),mat(0xb5b8b4));hub.rotation.z=Math.PI/2;hub.position.copy(w.position);tractor.add(hub)}
const farmer=new THREE.Group();scene.add(farmer);cyl(farmer,.28,.34,1.15,0x315d36,0,.85,0);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),mat(0x9a633d));head.position.y=1.58;farmer.add(head);cyl(farmer,.36,.36,.14,0x46351f,0,1.82,0);farmer.visible=false;
const cow=new THREE.Group();scene.add(cow);box(cow,1.6,.9,2,0xe8e2d2,-22,.65,-5);box(cow,.7,.7,.7,0xeee9df,-22,1.15,-6.1);for(const x of [-22.5,-21.5])for(const z of [-5.7,-4.5])cyl(cow,.09,.12,.6,0x514236,x,.25,z,8);cow.visible=false;
let driving=true,cameraMode=0,speed=0,day=1,money=5000,planted=0,growth=0,watered=false,fertilized=false,cows=0,crop='قمح';const keys={};let toastTimer;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',1900)}
function updateUI(){document.getElementById('money').textContent='💰 '+money.toLocaleString('ar')+' ج';document.getElementById('day').textContent='☀️ اليوم '+day;document.getElementById('stats').textContent='🌱 '+crop+': '+planted+' | النمو: '+growth+'%'+(watered?' | مروي':'');}
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
document.getElementById('switch').onclick=()=>{if(driving){driving=false;farmer.position.copy(tractor.position).add(new THREE.Vector3(2,0,0));farmer.rotation.y=tractor.rotation.y}else{if(farmer.position.distanceTo(tractor.position)>5){toast('اقترب من الجرار لركوبه');return}driving=true}tractor.visible=driving;farmer.visible=!driving;document.getElementById('switch').textContent=driving?'🚶 النزول من الجرار':'🚜 ركوب الجرار';document.getElementById('status').textContent=driving?'🚜 الجرار':'🧑‍🌾 المزارع';};
document.getElementById('plant').onclick=()=>{const p=driving?tractor.position:farmer.position;if(Math.abs(p.x)<21&&p.z<-2&&p.z>-36){if(planted>=cropMeshes.length){toast('الحقل ممتلئ، احصد المحصول أولاً');return}if(money<100){toast('الرصيد لا يكفي لشراء البذور');return}money-=100;planted++;growth=0;cropMeshes[planted-1].visible=true;updateUI();toast('زرعت '+crop+'! تكلفة البذور 100 ج')}else toast('اقترب من الحقل أولاً')};
document.getElementById('seed').onclick=()=>{crop=crop==='قمح'?'ذرة':crop==='ذرة'?'سمسم':'قمح';document.getElementById('seed').textContent='🌱 بذور: '+crop;toast('تم اختيار '+crop)};
document.getElementById('water').onclick=()=>{if(!planted){toast('ازرع أولاً');return}if(money<50){toast('تحتاج 50 ج للري');return}money-=50;watered=true;growth=Math.min(100,growth+20);updateUI();toast('تم ري الحقل، نمو المحصول تحسن')};
document.getElementById('fertilize').onclick=()=>{if(!planted){toast('لا يوجد محصول لتسميده');return}if(money<80){toast('تحتاج 80 ج للسماد');return}money-=80;fertilized=true;growth=Math.min(100,growth+15);updateUI();toast('تم تسميد المحصول')};
document.getElementById('sleep').onclick=()=>{day++;if(planted){growth=Math.min(100,growth+(watered?25:8)+(fertilized?10:0));watered=false;fertilized=false}updateUI();toast(growth>=100?'المحصول جاهز للحصاد!':'بدأ يوم جديد، المحصول ينمو تدريجياً')};
document.getElementById('market').onclick=()=>{if(!planted||growth<100){toast('المحصول لم ينضج بعد');return}const revenue=planted*(crop==='سمسم'?260:crop==='ذرة'?220:200);money+=revenue;planted=0;growth=0;cropMeshes.forEach(m=>m.visible=false);updateUI();toast('بعت المحصول وربحت '+revenue+' جنيه!')};
document.getElementById('animals').onclick=()=>{if(cows){toast('لديك بقرة بالفعل');return}if(money<1200){toast('شراء البقرة يكلف 1,200 ج');return}money-=1200;cows=1;cow.visible=true;updateUI();toast('اشتريت بقرة! ستنتج الحليب كل يومين')};
document.getElementById('camera').onclick=()=>{cameraMode=(cameraMode+1)%3;toast(['كاميرا خلفية','كاميرا قريبة','كاميرا علوية'][cameraMode])};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),actor=driving?tractor:farmer,move=keys.forward?1:keys.back?-1:0,turn=keys.left?1:keys.right?-1:0;if(move)speed+=(move*(driving?13:5)-speed*2.2)*dt;else speed*=Math.max(0,1-dt*3);actor.rotation.y+=turn*dt*(driving?1.7:2.3)*(Math.abs(speed)>.1?Math.sign(speed):1);const dir=new THREE.Vector3(Math.sin(actor.rotation.y),0,Math.cos(actor.rotation.y));actor.position.addScaledVector(dir,-speed*dt);actor.position.x=THREE.MathUtils.clamp(actor.position.x,-55,55);actor.position.z=THREE.MathUtils.clamp(actor.position.z,-65,48);if(driving)wheels.forEach(w=>w.rotation.x+=speed*dt*1.5);const target=actor.position.clone(),offset=(cameraMode===0?new THREE.Vector3(0,7,12):cameraMode===1?new THREE.Vector3(0,3.5,6):new THREE.Vector3(0,17,5)).applyAxisAngle(new THREE.Vector3(0,1,0),actor.rotation.y);camera.position.lerp(target.clone().add(offset),.08);camera.lookAt(target.x,target.y+1,target.z);renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);orient()});function orient(){document.getElementById('rotate').style.display=innerHeight>innerWidth?'flex':'none'}orient();
</script></body></html>
